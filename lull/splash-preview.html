<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晚风 Lull · 闪屏线条重画预览</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(120% 90% at 70% 8%, #221d46 0%, #14122b 45%, #0c0b1d 100%);
    color: #C9C4E4;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 64px;
  }
  h1 { font-size: 18px; font-weight: 600; color: #EDE9FF; margin: 0 0 6px; letter-spacing: .08em; }
  .sub { font-size: 12px; color: #8f89b8; margin-bottom: 36px; }
  .row { display: flex; gap: 56px; flex-wrap: wrap; justify-content: center; }
  .panel { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .panel .tag {
    font-size: 12px; letter-spacing: .12em; padding: 4px 14px; border-radius: 999px;
    border: 1px solid rgba(196,181,253,.25); color: #C4B5FD; background: rgba(196,181,253,.06);
  }
  .panel.new .tag { border-color: rgba(236,184,117,.35); color: #ECB875; background: rgba(236,184,117,.07); }
  .stage {
    width: 440px; height: 520px; border-radius: 18px;
    background: linear-gradient(180deg, #191636 0%, #100e26 62%, #0b0a1c 100%);
    box-shadow: 0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
    display: flex; align-items: center; justify-content: center;
  }
  .mini-row { display: flex; align-items: center; gap: 20px; margin-top: 8px; }
  .mini { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .mini span { font-size: 10px; color: #7d77a6; letter-spacing: .1em; }
  .mini-stage {
    background: #100e26; border-radius: 12px;
    box-shadow: 0 10px 26px rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
  }
  .note {
    max-width: 920px; margin-top: 44px; font-size: 12.5px; line-height: 2;
    color: #8f89b8; border-top: 1px solid rgba(196,181,253,.12); padding-top: 20px;
  }
  .note b { color: #C9C4E4; font-weight: 600; }
  button {
    margin-top: 40px; padding: 10px 28px; border-radius: 999px; cursor: pointer;
    font-size: 13px; letter-spacing: .1em;
    color: #EDE9FF; background: rgba(196,181,253,.12);
    border: 1px solid rgba(196,181,253,.35);
  }
  button:hover { background: rgba(196,181,253,.2); }

  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
</style>
</head>
<body>

<h1>闪屏线条 · 重画对比</h1>
<p class="sub">左：index_v3 现状（AI 手写 path）　右：按参考插画姿态重描（提案）</p>

<div class="row">

  <!-- ══ 当前 v3 版本 ══ -->
  <div class="panel">
    <span class="tag">当前 · v3</span>
    <div class="stage">
      <svg viewBox="0 0 320 380" width="380" style="display:block;filter:drop-shadow(0 0 14px rgba(196,181,253,.30))">
        <defs>
          <linearGradient id="splashInk" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#C4B5FD"/>
            <stop offset="100%" stop-color="#ECB875"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke="url(#splashInk)" stroke-linecap="round">
          <path class="draw" pathLength="1" style="animation-delay:.2s" stroke-width="2" d="M 138 88 C 148 100 156 112 158 124 C 159 130 161 134 164 139 C 167 143 167 147 163 149 C 167 152 168 156 165 159 C 163 161 163 163 166 166 C 168 171 166 176 160 179 C 154 183 148 184 143 182 C 133 190 128 205 130 225 C 131 235 133 243 136 250"/>
          <path class="draw" pathLength="1" style="animation-delay:1.0s" stroke-width="1.6" d="M 127 138 Q 136 144 146 139"/>
          <path class="draw" pathLength="1" style="animation-delay:1.1s" stroke-width="1.5" d="M 126 128 Q 136 130 147 126"/>
          <path class="draw" pathLength="1" style="animation-delay:.6s" stroke-width="1.7" d="M 138 88 C 128 79 116 77 105 82"/>
          <path class="draw" pathLength="1" style="animation-delay:.45s" stroke-width="1.8" d="M 138 88 C 150 78 155 68 148 58 C 138 44 116 38 98 44 C 77 51 64 66 58 88 C 53 108 55 130 49 150"/>
          <path class="draw" pathLength="1" style="animation-delay:.7s" stroke-width="1.6" opacity=".65" d="M 49 150 C 42 172 28 186 14 194"/>
          <path class="draw" pathLength="1" style="animation-delay:.8s" stroke-width="1.5" opacity=".55" d="M 58 100 C 48 122 46 144 54 164 C 61 182 50 198 36 210 C 27 218 20 227 14 238"/>
          <path class="draw" pathLength="1" style="animation-delay:.9s" stroke-width="1.4" opacity=".45" d="M 74 118 C 64 138 63 158 72 178 C 80 196 70 214 56 226"/>
          <path class="draw" pathLength="1" style="animation-delay:1.0s" stroke-width="1.5" opacity=".5" d="M 92 148 C 86 174 88 200 80 226 C 74 246 64 260 54 274"/>
          <path class="draw" pathLength="1" style="animation-delay:.95s" stroke-width="1.4" opacity=".4" d="M 134 184 C 142 206 140 228 150 250"/>
          <path class="draw" pathLength="1" style="animation-delay:1.3s" stroke-width="1.8" opacity=".85" d="M 104 262 C 86 270 66 278 50 290 C 38 298 28 308 22 320"/>
          <path class="draw" pathLength="1" style="animation-delay:1.35s" stroke-width="1.8" opacity=".85" d="M 152 258 C 166 266 184 274 202 284 C 216 292 228 304 236 318"/>
          <path class="draw" pathLength="1" style="animation-delay:1.45s" stroke-width="1.3" opacity=".35" d="M 124 272 Q 138 280 154 273"/>
          <path class="draw" pathLength="1" style="animation-delay:1.9s" stroke-width="1.6" opacity=".8" d="M 252 70 A 27 27 0 0 1 292 90"/>
          <path class="draw" pathLength="1" style="animation-delay:2.1s" stroke-width="1.3" opacity=".7" d="M 250 123 v 10 M 245 128 h 10"/>
          <path class="draw" pathLength="1" style="animation-delay:2.2s" stroke-width="1.2" opacity=".6" d="M 288 186 v 7 M 284.5 189.5 h 7"/>
          <path class="draw" pathLength="1" style="animation-delay:2.3s" stroke-width="1.2" opacity=".6" d="M 42 70 v 8 M 38 74 h 8"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- ══ 重画提案 ══ -->
  <div class="panel new">
    <span class="tag">重画 · 提案</span>
    <div class="stage">
      <svg viewBox="0 0 320 380" width="380" style="display:block;filter:drop-shadow(0 0 16px rgba(196,181,253,.28))">
        <defs>
          <linearGradient id="ink2" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ECB875"/>
            <stop offset="100%" stop-color="#C4B5FD"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke="url(#ink2)" stroke-linecap="round">
          <!-- ① 面部轮廓：额 → 鼻 → 唇 → 颌 → 颈，一条松弛连续曲线 -->
          <path class="draw" pathLength="1" style="animation-delay:.2s" stroke-width="2"
            d="M 141 66 C 152 73 163 87 168 104 C 170 109 168 113 167 117 C 170 123 176 127 179 132 C 181 135 174 137 171 140 C 174 143 178 144 178 147 C 178 150 173 150 172 152 C 175 155 176 158 174 161 C 172 164 170 165 169 167 C 164 173 155 178 147 182 C 142 192 139 202 138 212"/>
          <!-- 眉 -->
          <path class="draw" pathLength="1" style="animation-delay:1.0s" stroke-width="1.5" opacity=".8"
            d="M 164 101 Q 155 93 146 98"/>
          <!-- 闭目 -->
          <path class="draw" pathLength="1" style="animation-delay:1.05s" stroke-width="1.6"
            d="M 148 121 Q 155 127 163 119"/>
          <!-- 睫毛 -->
          <path class="draw" pathLength="1" style="animation-delay:1.15s" stroke-width="1.3" opacity=".7"
            d="M 162 119 l 4 4"/>
          <!-- ② 发 · 轮廓：发际越过头顶向后 -->
          <path class="draw" pathLength="1" style="animation-delay:.5s" stroke-width="1.8"
            d="M 141 66 C 137 55 126 47 112 48 C 94 49 80 60 75 76 C 71 89 73 103 71 116 C 69 130 62 141 52 148"/>
          <!-- 发 · 内层流线 -->
          <path class="draw" pathLength="1" style="animation-delay:.7s" stroke-width="1.4" opacity=".55"
            d="M 138 74 C 128 64 114 60 100 62 C 88 64 79 72 74 84"/>
          <path class="draw" pathLength="1" style="animation-delay:.75s" stroke-width="1.3" opacity=".5"
            d="M 74 86 C 71 97 73 107 70 116"/>
          <!-- 发 · 迎风飘丝（同一阵风，曲率一致，透明度递减） -->
          <path class="draw" pathLength="1" style="animation-delay:.85s" stroke-width="1.5" opacity=".6"
            d="M 110 50 C 88 46 64 52 44 68 C 34 76 26 86 20 98"/>
          <path class="draw" pathLength="1" style="animation-delay:.95s" stroke-width="1.4" opacity=".55"
            d="M 75 78 C 62 92 46 102 30 110 C 22 114 15 121 10 129"/>
          <path class="draw" pathLength="1" style="animation-delay:1.05s" stroke-width="1.4" opacity=".45"
            d="M 70 108 C 56 122 40 130 24 138 C 16 142 9 149 4 158"/>
          <path class="draw" pathLength="1" style="animation-delay:1.15s" stroke-width="1.3" opacity=".4"
            d="M 62 132 C 50 148 36 158 22 166 C 14 171 7 178 3 188"/>
          <path class="draw" pathLength="1" style="animation-delay:1.25s" stroke-width="1.2" opacity=".32"
            d="M 56 146 C 46 164 34 176 20 186 C 12 192 5 200 2 210"/>
          <!-- ③ 肩线：前肩自颈口展开，后肩自发间露出 -->
          <path class="draw" pathLength="1" style="animation-delay:1.4s" stroke-width="1.8" opacity=".85"
            d="M 138 212 C 154 218 172 226 188 238 C 200 246 210 256 218 268"/>
          <path class="draw" pathLength="1" style="animation-delay:1.45s" stroke-width="1.8" opacity=".85"
            d="M 86 168 C 68 182 50 196 34 214 C 26 223 18 234 12 246"/>
          <!-- 领口 -->
          <path class="draw" pathLength="1" style="animation-delay:1.5s" stroke-width="1.3" opacity=".4"
            d="M 136 214 Q 146 208 156 216"/>
          <!-- ④ 月与星：月牙移至她仰望的右上留白处，全画唯一暖光源 -->
          <path class="draw" pathLength="1" style="animation-delay:1.85s" stroke-width="1.8" opacity=".9"
            d="M 248 56 A 34 34 0 0 1 292 100"/>
          <path class="draw" pathLength="1" style="animation-delay:2.0s" stroke-width="1.3" opacity=".7"
            d="M 238 122 v 12 M 232 128 h 12"/>
          <path class="draw" pathLength="1" style="animation-delay:2.1s" stroke-width="1.2" opacity=".6"
            d="M 296 148 v 8 M 292 152 h 8"/>
          <path class="draw" pathLength="1" style="animation-delay:2.2s" stroke-width="1.2" opacity=".6"
            d="M 36 55 v 10 M 31 60 h 10"/>
          <path class="draw" pathLength="1" style="animation-delay:2.3s" stroke-width="1.1" opacity=".5"
            d="M 185 34 v 8 M 181 38 h 8"/>
        </g>
      </svg>
    </div>
    <!-- 母题复用：同一 SVG 缩到图标级尺寸 -->
    <div class="mini-row">
      <div class="mini">
        <div class="mini-stage" style="width:96px;height:114px">
          <svg viewBox="60 30 190 210" width="76">
            <use href="#newFig"/>
          </svg>
        </div>
        <span>空态 / 图标级 76px</span>
      </div>
      <div class="mini">
        <div class="mini-stage" style="width:64px;height:64px;border-radius:16px">
          <svg viewBox="55 55 150 130" width="48">
            <use href="#newFig"/>
          </svg>
        </div>
        <span>App 图标级 48px</span>
      </div>
    </div>
  </div>

</div>

<button onclick="replay()">↻ 重播描边动画</button>

<p class="note">
  <b>重画要点：</b>① 面部轮廓改为一条连续松弛曲线（额 → 鼻 → 唇 → 颌 → 颈），消除 v3 颧骨段的生硬转折；② 发丝统一曲率、透明度递减，营造「夜色吞没发尾」；③ 月牙移到她仰望方向的右上留白处，渐变方向反转（右上暖金 → 左下薰衣草紫），呼应「月光落在脸上」；④ 右下两个小图演示同一 SVG 裁切视图在图标/空态尺寸下的复用。
</p>

<!-- 隐藏母版：供 use 复用 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="ink3" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECB875"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <g id="newFig" fill="none" stroke="url(#ink3)" stroke-linecap="round">
      <path stroke-width="3.2" d="M 141 66 C 152 73 163 87 168 104 C 170 109 168 113 167 117 C 170 123 176 127 179 132 C 181 135 174 137 171 140 C 174 143 178 144 178 147 C 178 150 173 150 172 152 C 175 155 176 158 174 161 C 172 164 170 165 169 167 C 164 173 155 178 147 182 C 142 192 139 202 138 212"/>
      <path stroke-width="2.4" opacity=".8" d="M 164 101 Q 155 93 146 98"/>
      <path stroke-width="2.6" d="M 148 121 Q 155 127 163 119"/>
      <path stroke-width="2.1" opacity=".7" d="M 162 119 l 4 4"/>
      <path stroke-width="2.9" d="M 141 66 C 137 55 126 47 112 48 C 94 49 80 60 75 76 C 71 89 73 103 71 116 C 69 130 62 141 52 148"/>
      <path stroke-width="2.2" opacity=".55" d="M 138 74 C 128 64 114 60 100 62 C 88 64 79 72 74 84"/>
      <path stroke-width="2.2" opacity=".5" d="M 74 86 C 71 97 73 107 70 116"/>
      <path stroke-width="2.4" opacity=".6" d="M 110 50 C 88 46 64 52 44 68 C 34 76 26 86 20 98"/>
      <path stroke-width="2.2" opacity=".55" d="M 75 78 C 62 92 46 102 30 110 C 22 114 15 121 10 129"/>
      <path stroke-width="2.2" opacity=".45" d="M 70 108 C 56 122 40 130 24 138 C 16 142 9 149 4 158"/>
      <path stroke-width="2.1" opacity=".4" d="M 62 132 C 50 148 36 158 22 166 C 14 171 7 178 3 188"/>
      <path stroke-width="2" opacity=".32" d="M 56 146 C 46 164 34 176 20 186 C 12 192 5 200 2 210"/>
      <path stroke-width="2.9" opacity=".85" d="M 138 212 C 154 218 172 226 188 238 C 200 246 210 256 218 268"/>
      <path stroke-width="2.9" opacity=".85" d="M 86 168 C 68 182 50 196 34 214 C 26 223 18 234 12 246"/>
      <path stroke-width="2.1" opacity=".4" d="M 136 214 Q 146 208 156 216"/>
    </g>
  </defs>
</svg>

<script>
  function replay() {
    document.querySelectorAll('.stage svg, .mini svg').forEach(svg => {
      const clone = svg.cloneNode(true);
      svg.replaceWith(clone);
    });
  }
</script>

</body>
</html>
