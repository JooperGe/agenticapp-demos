<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一局</title>
<style>
  :root{
    --bg:#0F1117; --surface:#171A23; --surface-2:#1F2430; --line:rgba(255,255,255,.08);
    --ink:#F2F4F8; --ink-dim:#9AA3B2; --ink-soft:#5F6875;
    --brand:#6C5CE7; --brand-2:#00D2A8; --ok:#2BD97C; --warn:#FFB020; --danger:#FF5C5C;
    --r-lg:20px; --r-md:14px; --r-sm:10px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:#08090D; color:var(--ink); height:100vh; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,"PingFang SC",system-ui,sans-serif;
  }
  #scaler{ width:390px; height:844px; flex:none; transform-origin:center; }
  #phone{
    width:390px; height:844px; background:var(--bg); position:relative;
    border-radius:36px; overflow:hidden; border:1px solid var(--line);
    box-shadow:0 40px 80px -20px rgba(0,0,0,.8);
  }
  #app{ position:absolute; inset:0 0 64px 0; overflow-y:auto; }
  nav.tabbar{
    position:absolute; left:0; right:0; bottom:0; height:64px;
    display:flex; border-top:1px solid var(--line); background:rgba(15,17,23,.94);
  }
  nav.tabbar .tab{
    flex:1; background:none; border:0; color:var(--ink-soft); cursor:pointer;
    font-size:11px; display:flex; flex-direction:column; gap:3px;
    align-items:center; justify-content:center; font-family:inherit;
  }
  nav.tabbar .tab .ico{ font-size:17px; }
  nav.tabbar .tab.on{ color:var(--brand-2); }

  /* ── 目标首页 ── */
  .scr-head{ padding:22px 18px 14px; }
  .scr-head h1{ font-size:20px; font-weight:600; }
  .scr-head p{ margin-top:6px; font-size:12px; color:var(--ink-dim); }
  .scr-head.with-back{ position:relative; padding-left:48px; }
  .scr-head .back{
    position:absolute; left:14px; top:20px; width:28px; height:28px;
    background:var(--surface-2); border:1px solid var(--line); color:var(--ink);
    border-radius:var(--r-sm); font-size:16px; line-height:1; cursor:pointer; font-family:inherit;
  }
  .goal-list{ padding:0 14px 18px; display:flex; flex-direction:column; gap:10px; }
  .goal-card{
    width:100%; text-align:left; cursor:pointer; font-family:inherit;
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    border-radius:var(--r-lg); padding:14px 16px;
  }
  .goal-card[data-depth="shallow"]{ opacity:.55; }
  .gc-top{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .gc-title{ font-size:15px; font-weight:600; }
  .gc-subject{
    flex:none; font-size:10px; color:var(--brand-2);
    border:1px solid var(--line); border-radius:var(--r-sm); padding:2px 7px;
  }
  .bar{ height:6px; margin:12px 0 9px; background:var(--surface-2); border-radius:var(--r-sm); overflow:hidden; }
  .bar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--brand-2)); }
  .gc-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .gc-tag{ font-size:11px; color:var(--ink-dim); }
  .gc-num{ font-size:11px; color:var(--ink-soft); }
  .goal-new{
    width:100%; padding:15px; cursor:pointer; font-family:inherit; font-size:13px;
    color:var(--ink-dim); background:none; border:1px dashed var(--line); border-radius:var(--r-lg);
  }

  /* ── 成长轨迹 ── */
  .trail{
    margin:0 14px 16px; padding:14px 16px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  }
  .trail-title{ font-size:11px; color:var(--ink-dim); }
  .trail-bar{ display:flex; gap:6px; margin:10px 0; }
  .dot{ flex:1; height:5px; background:var(--surface-2); border-radius:var(--r-sm); }
  .dot.done{ background:var(--ok); }
  .trail-note{ font-size:11px; color:var(--ink-soft); line-height:1.5; }

  /* ── 关卡序列 ── */
  .ability-list{ list-style:none; padding:0 14px 20px; display:flex; flex-direction:column; gap:8px; }
  .ability{
    display:flex; align-items:center; gap:10px; padding:13px 14px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
    font-size:13px; color:var(--ink-dim);
  }
  .ability.done{ color:var(--ink); }
  .ab-idx{
    flex:none; width:22px; height:22px; border-radius:50%; background:var(--surface-2);
    color:var(--ink-soft); font-size:11px;
    display:flex; align-items:center; justify-content:center;
  }
  .ability.done .ab-idx{ background:var(--ok); color:var(--bg); }
  .ab-name{ flex:1; }
  .ab-play{ flex:none; font-size:11px; color:var(--brand-2); }

  /* ── 创作对话流 ── */
  .chat{ padding:0 14px; display:flex; flex-direction:column; gap:8px; }
  .msg{
    max-width:78%; padding:10px 13px; font-size:13px; line-height:1.55;
    border-radius:var(--r-md);
  }
  .msg.ai{ align-self:flex-start; background:var(--surface); border:1px solid var(--line); color:var(--ink); }
  .msg.me{ align-self:flex-end; background:var(--brand); color:var(--ink); }
  .chat-next{
    display:block; width:calc(100% - 28px); margin:10px 14px 18px; padding:13px;
    font-family:inherit; font-size:13px; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-md); cursor:pointer;
  }
  .chat-next[hidden]{ display:none; }   /* 作者样式的 display 会盖掉 UA 的 [hidden]，显式补回 */
  .preview-card{
    margin-top:4px; padding:16px; text-align:center;
    background:var(--surface-2); border:1px solid var(--brand); border-radius:var(--r-md);
  }
  .pv-emoji{ font-size:40px; }
  .pv-title{ margin-top:8px; font-size:14px; font-weight:600; }
  .pv-meta{ margin-top:5px; font-size:11px; color:var(--ink-dim); }
  .pv-start{
    width:100%; margin-top:14px; padding:13px; font-family:inherit; font-size:13px; font-weight:600;
    color:var(--bg); background:var(--brand-2); border:0; border-radius:var(--r-md); cursor:pointer;
  }

  /* ── toast ── */
  #toast{
    position:absolute; left:50%; bottom:88px; transform:translateX(-50%);
    opacity:0; pointer-events:none; transition:opacity .2s;
    background:var(--surface-2); border:1px solid var(--line); color:var(--ink);
    border-radius:var(--r-md); padding:10px 14px; font-size:12px;
    max-width:78%; text-align:center; z-index:30;   /* 必须高于 #container 的 20：结算页（在容器里）弹的发布/分享 toast，低于 20 会被整块盖住 */
  }
  #toast.on{ opacity:1; }

  /* ── 游戏容器 ── */
  #container{
    position:absolute; inset:0; z-index:20; background:var(--bg);
    display:none;
  }
  #container.on{ display:block; }
  .cg-forecast{
    position:absolute; left:0; right:0; top:0; padding:20px 64px 0 18px;
    font-size:12px; color:var(--brand-2);
  }
  .cg-skeleton{
    position:absolute; left:18px; right:18px; top:64px;
    display:flex; flex-direction:column; gap:10px;
  }
  .cg-skeleton[hidden]{ display:none; }   /* 作者样式的 display 会盖掉 UA 的 [hidden]，显式补回 */
  .cg-skeleton .sk-bar{
    height:14px; border-radius:var(--r-sm); background:var(--surface-2);
    animation:sk-breath 1.2s ease-in-out infinite;
  }
  .cg-skeleton .sk-bar.short{ width:56%; }
  @keyframes sk-breath{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }
  .cd-count{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:72px; font-weight:600; color:var(--ink);
  }
  .cd-count[hidden]{ display:none; }      /* 同上：居中用了 display:flex */
  .cg-stage{ position:absolute; inset:0; }
  .cg-stage[hidden]{ display:none; }
  .cg-todo{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:var(--ink-soft);
  }
  .cg-exit{
    position:absolute; left:0; top:0; z-index:2; width:44px; height:44px;
    background:none; border:0; color:var(--ink-dim); font-size:16px; line-height:1;
    cursor:pointer; font-family:inherit; touch-action:none;
  }

  /* ── 机制：抢拍 · 手指跑酷 ── */
  .rhythm{ position:absolute; inset:0; display:flex; flex-direction:column; padding:56px 12px 16px; }
  .rhythm .hud{ display:flex; align-items:baseline; justify-content:space-between; padding:0 4px 10px; }
  .rhythm .hp{ font-size:15px; font-weight:600; color:var(--ink); }
  .rhythm .hp::before{ content:'♥ '; color:var(--danger); }
  .rhythm .combo{ font-size:12px; color:var(--ink-dim); }
  .rhythm .combo::before{ content:'连击 '; }
  .rhythm .lanes{
    position:relative; flex:1; display:flex; overflow:hidden; border-radius:var(--r-md);
  }
  .rhythm .track{
    flex:1 1 25%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    gap:4px; padding-bottom:14px; cursor:pointer; font-family:inherit; touch-action:manipulation;
    background:var(--surface-2); border:0; border-right:1px solid var(--line); color:var(--ink);
  }
  .rhythm .track:last-of-type{ border-right:0; }
  .rhythm .track:active{ box-shadow:inset 0 0 0 2px var(--brand); }
  .rhythm .tk-chord{ font-size:18px; font-weight:600; color:var(--brand-2); }
  .rhythm .tk-fing{ font-size:10px; color:var(--ink-soft); letter-spacing:1px; }
  .rhythm .blocks{ position:absolute; inset:0; z-index:2; overflow:hidden; pointer-events:none; }
  .rhythm .block{
    position:absolute; width:calc(25% - 10px); height:46px; box-sizing:border-box;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:600; color:var(--bg); border-radius:var(--r-sm);
    background:linear-gradient(180deg,var(--brand-2),var(--brand));
  }
  .rhythm .block[data-track="0"]{ left:5px; }
  .rhythm .block[data-track="1"]{ left:calc(25% + 5px); }
  .rhythm .block[data-track="2"]{ left:calc(50% + 5px); }
  .rhythm .block[data-track="3"]{ left:calc(75% + 5px); }
  .rhythm .judge-line{
    position:absolute; left:0; right:0; top:82%; z-index:1;
    border-top:2px dashed var(--warn); pointer-events:none;
  }
  .rhythm.fx-hit .lanes{ animation:rh-hit .32s ease-out; }
  .rhythm.fx-miss .lanes{ animation:rh-miss .32s ease-out; }
  @keyframes rh-hit{ from{ box-shadow:inset 0 0 0 3px var(--ok) } to{ box-shadow:inset 0 0 0 3px var(--line) } }
  @keyframes rh-miss{ from{ box-shadow:inset 0 0 0 3px var(--danger) } to{ box-shadow:inset 0 0 0 3px var(--line) } }

  /* ── 机制：对撞 · 分数僵尸战 ── */
  .collide{ position:absolute; inset:0; display:flex; flex-direction:column; padding:56px 12px 16px; }
  .collide .hud{ display:flex; align-items:baseline; justify-content:space-between; padding:0 4px 10px; }
  .collide .wall{ font-size:15px; font-weight:600; color:var(--ink); }
  .collide .wall::before{ content:'城墙 '; font-size:12px; font-weight:400; color:var(--ink-dim); }
  .collide .wave{ font-size:12px; color:var(--ink-dim); }
  .collide .field{
    position:relative; flex:1; overflow:hidden; margin-bottom:12px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  }
  /* 僵尸从右侧走到 right:72%（左起 28%）处即为破墙 —— 城墙占左起 28%，边界线正好接住 */
  .collide .wall-face{
    position:absolute; left:0; top:0; bottom:0; width:28%; pointer-events:none;
    background:linear-gradient(90deg,var(--surface-2),var(--surface));
    border-right:1px solid var(--line);
  }
  .collide .zombie{
    position:absolute; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .collide .zm-body{ font-size:26px; line-height:1; }
  .collide .zm-expr{
    font-size:12px; font-weight:600; color:var(--ink); white-space:nowrap;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    background:var(--surface-2); border:1px solid var(--line);
    border-radius:var(--r-sm); padding:3px 7px;
  }
  .collide .turrets{ display:flex; gap:8px; }
  .collide .turret{
    flex:1; padding:16px 0; cursor:pointer; font-family:inherit; touch-action:manipulation;
    font-size:16px; font-weight:600; color:var(--ink); background:var(--brand);
    border:1px solid var(--line); border-radius:var(--r-md);
  }
  .collide .turret:active{ transform:scale(.96); }
  .collide .turrets.disarmed{ opacity:.45; pointer-events:none; }   /* 未入射程：纯视觉，_tap 不受影响 */
  .collide .field.fx-boom{ animation:cg-boom .3s ease-out; }
  .collide .field.fx-crack{ animation:cg-crack .3s ease-out; }
  @keyframes cg-boom{ from{ box-shadow:inset 0 0 0 3px var(--ok) } to{ box-shadow:inset 0 0 0 3px var(--line) } }
  @keyframes cg-crack{ from{ box-shadow:inset 0 0 0 3px var(--danger) } to{ box-shadow:inset 0 0 0 3px var(--line) } }

  /* ── 结算 · 反哺 ── */
  .result{
    position:absolute; inset:0; z-index:1; overflow-y:auto;
    padding:64px 20px 28px; background:var(--bg);
    display:flex; flex-direction:column; gap:12px;
  }
  .rs-title{ font-size:22px; font-weight:600; color:var(--ink); }
  .rs-row{
    padding:14px 16px; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--r-lg);
  }
  .rs-k{ display:block; font-size:11px; color:var(--ink-dim); }
  .rs-strong, .rs-weak, .rs-next{ display:block; margin-top:6px; font-size:15px; font-weight:600; }
  .rs-strong{ color:var(--brand-2); }
  .rs-weak{ color:var(--warn); }
  .rs-next{ font-size:13px; font-weight:400; line-height:1.6; color:var(--ink); }
  .rs-acts{ margin-top:auto; padding-top:12px; display:flex; flex-direction:column; gap:8px; }
  .rs-acts button{
    width:100%; padding:13px; cursor:pointer; font-family:inherit; font-size:13px;
    color:var(--ink); background:var(--surface-2);
    border:1px solid var(--line); border-radius:var(--r-md);
  }
  .rs-replay{ font-weight:600; color:var(--bg); background:var(--brand-2); border-color:var(--brand-2); }

  /* ── 广场 · 作品卡 ── */
  .work-list{ padding:0 14px 18px; display:flex; flex-direction:column; gap:10px; }
  .work-card{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
    font-family:inherit; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:var(--r-lg); padding:12px;
  }
  .wc-cover{
    flex:none; width:52px; height:52px; border-radius:var(--r-md);
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }
  .wc-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .wc-title{ font-size:14px; font-weight:600; }
  .wc-meta{ font-size:11px; color:var(--ink-dim); }
  .wc-mech{ font-size:10px; color:var(--brand-2); }
  .wc-plays{ font-size:10px; color:var(--ink-soft); }
  .wc-mine{
    align-self:flex-start; margin-top:2px; font-size:10px; color:var(--brand-2);
    border:1px solid var(--line); border-radius:var(--r-sm); padding:1px 6px;
  }

  /* ── 我 · 进步只给自己看 ── */
  .me-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:0 14px 16px; }
  .ms-cell{
    display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center;
    padding:14px 4px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  }
  .ms-cell b{ font-size:20px; font-weight:600; color:var(--ink); }
  .ms-cell span{ font-size:10px; color:var(--ink-dim); }
  .me-skills{
    margin:0 14px 16px; padding:14px 16px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  }
  .me-skills h2{ font-size:12px; font-weight:600; color:var(--ink-dim); margin:0 0 8px; }
  /* 技能条：容器 .me-skills 后代限定 —— 裸 .sk-bar 会把骨架屏（.cg-skeleton .sk-bar）缺省的属性泄漏进容器遮罩 */
  .me-skills .skill{ display:flex; align-items:center; gap:10px; padding:6px 0; font-size:12px; }
  .me-skills .sk-n{ flex:none; width:56px; color:var(--ink); }
  .me-skills .sk-bar{
    flex:1; height:6px; background:var(--surface-2);
    border-radius:var(--r-sm); overflow:hidden;
  }
  .me-skills .sk-bar > i{
    display:block; height:100%;
    background:linear-gradient(90deg,var(--brand),var(--brand-2));
  }
  .me-skills .sk-v{ flex:none; width:34px; text-align:right; color:var(--ink-dim); }
  /* .work-card 自身只有 width:100%，卡间距 / 左右内边距来自父级（对照 .work-list），这里自己给出 */
  .me-works{ padding:0 14px 18px; display:flex; flex-direction:column; gap:10px; }
  .me-works h2{ font-size:12px; font-weight:600; color:var(--ink-dim); margin:0; }
  .me-empty{ padding:10px 0; font-size:12px; color:var(--ink-soft); }

  /* ── 作品页 ── */
  .gp-play{
    display:block; width:calc(100% - 28px); margin:2px 14px 16px; padding:14px;
    font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;
    color:var(--ink); background:var(--brand); border:0; border-radius:var(--r-md);
  }
  .gp-chain-wrap, .gp-board, .gp-comments{
    margin:0 14px 12px; padding:14px 16px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  }
  .gp-chain-wrap h2, .gp-board h2, .gp-comments h2{
    font-size:12px; font-weight:600; color:var(--ink-dim); margin-bottom:10px;
  }
  /* 二创树是本产品最重要的可视化：缩进体现层级，↳ 由数据渲染，当前节点主色高亮 */
  .gp-chain{ display:flex; flex-direction:column; gap:6px; }
  .chain-node{ font-size:13px; color:var(--ink-dim); }
  .chain-node:nth-child(2){ padding-left:18px; }
  .chain-node:nth-child(3){ padding-left:36px; }
  .chain-node:nth-child(4){ padding-left:54px; }
  .chain-node:nth-child(5){ padding-left:72px; }
  .chain-node:nth-child(6){ padding-left:90px; }
  .chain-node:nth-child(n+7){ padding-left:90px; }   /* 深度 7+ 沿用最深缩进，避免 nth-child 失配后回落到根节点缩进 */
  .chain-node em{ font-style:normal; margin-left:6px; font-size:11px; color:var(--ink-soft); }
  .chain-node.cur{ color:var(--brand-2); font-weight:600; }
  .chain-node.cur em{ color:var(--brand-2); }
  .gp-chain-note{ margin-top:10px; font-size:11px; color:var(--ink-soft); line-height:1.5; }
  .board-row{ display:flex; align-items:center; gap:10px; padding:8px 0; font-size:13px; }
  .board-row + .board-row{ border-top:1px solid var(--line); }
  .br-i{ flex:none; width:18px; font-size:11px; color:var(--ink-soft); }
  .br-n{ flex:1; }
  .br-s{ font-weight:600; }
  .board-row.me .br-n{ color:var(--brand-2); }
  .cmt{ font-size:12px; line-height:1.6; color:var(--ink-dim); padding:7px 0; }
  .cmt + .cmt{ border-top:1px solid var(--line); }
  .gp-remix{
    display:block; width:calc(100% - 28px); margin:2px 14px 20px; padding:13px;
    font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
    color:var(--bg); background:var(--brand-2); border:0; border-radius:var(--r-md);
  }

  /* ── 二创抽屉：从底部升起，选完档位即关闭 ── */
  .remix-sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:10;
    padding:18px 16px 20px; display:flex; flex-direction:column; gap:10px;
    background:var(--surface); border-top:1px solid var(--line);
    border-radius:var(--r-lg) var(--r-lg) 0 0;
    animation:rs-rise .22s ease-out;
  }
  @keyframes rs-rise{ from{ transform:translateY(24px); opacity:.4 } to{ transform:none; opacity:1 } }
  .rs-head{ padding:0 2px 4px; font-size:14px; font-weight:600; color:var(--ink); }
  .tier{
    display:flex; flex-direction:column; align-items:flex-start; gap:4px;
    width:100%; padding:14px 16px; text-align:left; cursor:pointer; font-family:inherit;
    background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-md);
  }

    display:grid; grid-template-columns:26px minmax(0,1fr) auto auto; align-items:center; gap:10px;

  /* ── 站外邀请卡：居中的出站预览，只带身份描述 ── */
  /* z-index 必须高于 #container 的 20：邀请卡由结算页的「发给朋友」触发，而结算页就在
     #container 里（showResult 不关容器），且 #container 是不透明的整屏块 —— 低于 20 会被完全盖住 */
  .share-card{
    position:absolute; left:18px; right:18px; top:50%; z-index:30;
    transform:translateY(-50%); padding:22px 20px 18px;
    display:flex; flex-direction:column; gap:10px; text-align:center;

<script>
// ══ 1. STATE
const state = { screen:'goal', goalId:null, gameId:null, pageId:null, rankBoard:null, rankSubject:null };

// 上报总线：机制往里塞 attempt / run，结算据此算"过了什么、卡在哪"
// attempt 打上产生它的局（run === gameGen）：每局结算是per-run的，
// 累积轨迹（Task 12 的 myStats）才读未过滤的 BUS.attempts
const BUS = { attempts: [], runs: [] };
const reportAttempt = a => BUS.attempts.push({ ...a, run: gameGen });
// 一局只在这里结束（跑酷 / 对撞都走它）：赢了才把进度累积回目标
const finishRun = r => { BUS.runs.push(r); if(r.outcome === 'win') advanceGoal(state.gameId); };

// 通关反哺：赢了才把进度推一格，输了不动（失败不能解锁下一项能力）
function advanceGoal(gameId){
  const gid = Object.keys(GOAL_GAME).find(k=> GOAL_GAME[k] === gameId);
  if(!gid) return;                                  // 自造 / 二创的作品不属于任何目标
  const g = GOALS.find(x=> x.id === gid);
  if(!g || g.done >= g.total) return;               // 到顶不越界
  g.done++;
  if(state.screen === 'goalDetail' && state.goalId === gid) renderGoalDetail(gid);  // 详情开着就地重画
}

// ══ 1b. 画布缩放
function computeScale(w, h){ return Math.min(1, w / 390, h / 844); }
function fitScale(){
  const scaler = document.getElementById('scaler');
  scaler.style.transform = 'scale(' + computeScale(window.innerWidth, window.innerHeight) + ')';
}
window.addEventListener('resize', fitScale);

// ══ 2. DATA  （Task 2 起填充）
// Goal = { id, title, subject, levelTag, depth:'deep'|'shallow', done, total, abilities:string[], note }
const GOALS = [
  { id:'guitar', title:'能弹唱一首歌', subject:'乐理', levelTag:'想能看着谱弹唱', depth:'deep',
    done:1, total:6, abilities:['认识四和弦指法','和弦转换不卡','节奏稳定','扫弦型入门','跟谱弹唱','完整来一遍'],
    note:'从 40 BPM 起手，先求不错音，再求速度' },
  { id:'fraction', title:'搞定五年级通分', subject:'数学', levelTag:'分数加减老出错', depth:'deep',
    done:0, total:6, abilities:['同分母加减','找公分母','通分','异分母加减','约分','混合运算'],
    note:'通分是这一步的坎，过了后面都顺' },
  { id:'english', title:'看懂美剧不用字幕', subject:'英语', levelTag:'听力跟不上语速', depth:'shallow',
    done:0, total:5, abilities:['高频词听辨','连读','弱读','语块整听','整句复述'], note:'' },

    done:0, total:4, abilities:['净值与份额','定投摊薄','止盈线','组合分散'], note:'' },
];
const getGoal = id => GOALS.find(g=>g.id === id);
// 深做目标 → 该目标当前该玩的关卡（Task 5 / Task 7 提供对应机制）
const GOAL_GAME = { guitar:'guitar-l1', fraction:'fraction-l3' };

// 创作对话剧本：一句句追问，最后落到预告卡
const CREATION_SCRIPT = [
  { from:'ai', text:'今天想学点什么？' },
  { from:'me', text:'我想能弹唱一首歌' },
  { from:'ai', text:'好。那我们先解决最容易卡住的地方——和弦换手。' },
  { from:'ai', text:'我先想的是一道选择题，想了想那样不好玩——换个机制，让你用手指按和弦。' },
  { from:'ai', text:'不用背，玩两局就熟了。' },
  { kind:'preview', gameId:'guitar-l1', title:'手指跑酷', mechanic:'抢拍', knowledge:'和弦转换', emoji:'🎸' },

// 抢拍 · 手指跑酷：4 条轨道 = C / Am / F / G 四个和弦指法位
const CHORDS = [
  { label:'C',  fingering:'x32010' },
  { label:'Am', fingering:'x02210' },
  { label:'F',  fingering:'133211' },
  { label:'G',  fingering:'320003' },
];
const GUITAR_BLOCKS = Array.from({ length:24 }, (_,i)=>({
  at:i, track:i % 4, point: CHORDS[i % 4].label + '和弦指法',

// 机制内容：Task 5 / Task 7 按 gameId 填充（runMechanic 需容忍 undefined）
// fall / gap 是节奏常量，放在内容对象里，让「一局 60–120 秒」的估算有同一个真值来源
const MECHANIC_CONTENT = {
  'guitar-l1': { tracks:CHORDS, blocks:GUITAR_BLOCKS, hp:5, speed:1.0, fall:0.00022, gap:1.1 },
};

// 对撞 · 分数僵尸战：8 波，共 11 只僵尸，每只一个算式 + 两个陷阱
// 陷阱是典型错法：分子分母各自相加、或只换了分母没换分子 —— 不能有第二个正确答案
const FRACTION_WAVES = [

  { zombies:[{ id:'z2', expr:'1/2 + 1/3', answer:'5/6',  decoys:['2/5','3/6'] },
             { id:'z3', expr:'2/3 + 1/4', answer:'11/12', decoys:['3/7','9/12'] }] },
  { zombies:[{ id:'z4', expr:'5/6 - 1/3', answer:'1/2',  decoys:['4/3','6/9'] },
             { id:'z5', expr:'3/5 + 1/2', answer:'11/10', decoys:['4/7','8/10'] }] },
  { zombies:[{ id:'z6', expr:'7/8 - 1/4', answer:'5/8',  decoys:['6/4','8/8'] }] },
  { zombies:[{ id:'z7', expr:'2/5 + 1/2', answer:'9/10', decoys:['3/7','6/10'] },
             { id:'z8', expr:'1/3 + 1/6', answer:'1/2',  decoys:['2/9','2/6'] }] },
  { zombies:[{ id:'z9', expr:'4/9 + 1/3', answer:'7/9',  decoys:['5/12','6/9'] }] },
  { zombies:[{ id:'z10', expr:'5/8 - 1/2', answer:'1/8', decoys:['4/6','6/8'] }] },
  { zombies:[{ id:'z11', expr:'3/7 + 2/5', answer:'29/35', decoys:['5/12','25/35'] }] },

// enter 是射程门槛：僵尸走到 enter 之前炮台没架好，点击不生效。
// 它同时是「一局 60–120 秒」的结构下限（完美通关也要走完 8 波的走进时间）。
MECHANIC_CONTENT['fraction-l3'] = { waves:FRACTION_WAVES, wallHp:3, speed:1, enter:0.45 };

// 六种机制：id → 人话名字 + 玩法形状 + 皮肤。playable 标记 demo 里真做出来的机制。
const MECHANICS = [
  { id:'collide', name:'对撞', shape:'唯一答案的计算', skins:['坟场','太空','深海'], playable:true },
  { id:'rhythm',  name:'抢拍', shape:'时序与反应',     skins:['舞台','夜市','雨林'], playable:true },

  { id:'boss',    name:'Boss 战', shape:'综合应用',    skins:['王座','决赛场','火山'], playable:false },
];

// 广场预置作品。[id,title,author,subject,mechanic,plays,emoji,cover,parentId,remixes,score]
const SEED_WORKS = [
  ['w-fraction-zombie','分数僵尸战','豆豆','数学','collide',248,'🧟',['#3B2E5A','#7C5CFF'],'w-fraction-base',12,8600],
  ['w-fraction-base','分数大作战','小红','数学','collide',512,'➗',['#233B5A','#4A9BE8'],null,31,9100],
  ['w-chord-run','和弦跑酷','阿力','乐理','rhythm',187,'🎸',['#5A2E3B','#FF7A9C'],null,9,7400],
  ['w-space-chord','太空版和弦跑酷','豆豆','乐理','rhythm',96,'🛰️',['#1E3A4A','#39D0D8'],'w-chord-run',4,6800],
  ['w-word-snake','词性贪吃蛇','小满','英语','collect',331,'🐍',['#2E5A3B','#5CE88A'],null,17,7900],
  ['w-syntax-bridge','语法搭桥','阿力','英语','path',142,'🌉',['#4A3A1E','#E8B44A'],null,6,6200],
  ['w-periodic-build','元素配平工坊','老周','化学','build',88,'⚗️',['#3A1E4A','#C46AE8'],null,3,5400],
  ['w-ear-train','音程听辨','小满','乐理','collect',204,'👂',['#1E4A4A','#4AE8C4'],null,11,8100],
  ['w-unit-swap','单位换算大乱斗','豆豆','数学','collide',173,'📐',['#4A2E1E','#E88A4A'],'w-fraction-zombie',5,7200],
  ['w-idiom-path','成语接龙跳台','小满','语文','path',266,'🀄',['#5A1E2E','#E85A7A'],null,14,7700],
  ['w-earnings','汇率狙击','老周','财商','collide',119,'💱',['#1E4A2E','#4AE87A'],null,2,6600],
  ['w-recycle','垃圾分类快手','阿力','常识','collect',402,'♻️',['#2E4A1E','#8AE84A'],null,21,8300],
  ['w-scale-build','音阶建造','豆豆','乐理','build',77,'🎹',['#2E2E5A','#7A7AFF'],'w-chord-run',3,5900],
  ['w-fitness-pace','动作节奏器','老周','健身','rhythm',156,'🏋️',['#5A3A1E','#E8A44A'],null,7,7000],
  ['w-grammar-boss','语法总攻','小满','英语','boss',63,'👑',['#4A1E1E','#E85A5A'],'w-syntax-bridge',1,5800],
  ['w-mix-boss','混合运算决战','小红','数学','boss',221,'🔥',['#5A2E1E','#FF8A3A'],'w-fraction-base',8,8800],

const PUBLISHED = SEED_WORKS.map(([id,title,author,subject,mechanic,plays,emoji,cover,parentId,remixes,score])=>
  ({ id, title, author, subject, mechanic, plays, emoji, cover, parentId, remixes, score }));

// 排行榜：三层榜 + 学科 chips。周期是周榜（周一零点重置），新人永远有机会。
const RANK_DEFS = [
  { id:'works',    name:'作品榜',   hint:'按玩完率排，不按点击量' },
  { id:'creators', name:'创作者榜', hint:'被玩完量 × 被二创数，不按作品数量' },

];

const RANK_SUBJECTS = ['全部','数学','乐理','英语','语文','化学','财商'];

// ══ 3. ROUTER
function showScreen(id){
  document.querySelectorAll('[data-screen]').forEach(s=>{ s.hidden = s.dataset.screen !== id; });
  state.screen = id;
  document.querySelectorAll('.tab').forEach(t=>{ t.classList.toggle('on', t.dataset.goto === id); });
  if(id === 'square') renderSquare();
  if(id === 'rank') renderRankings();
  if(id === 'me') renderMe();
}
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=> showScreen(t.dataset.goto));
});

// ══ 4. COMPONENTS （Task 2 起填充）
function toast(msg, ms = 1800){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  if(!SELFTEST_MODE) setTimeout(()=> el.classList.remove('on'), ms);
}

function renderGoals(){
  const hosts = document.querySelectorAll('[data-screen="goal"]');
  hosts.forEach(h=>{
    h.innerHTML = `
      <header class="scr-head"><h1>我的目标</h1><p>你说想学什么，它给你造一个游戏</p></header>
      <div class="goal-list">
        ${GOALS.map(g=>`
          <button class="goal-card" data-goal="${g.id}" data-depth="${g.depth}">
            <div class="gc-top">
              <span class="gc-title">${g.title}</span>
              <span class="gc-subject">${g.subject}</span>
            </div>
            <div class="bar"><i style="width:${Math.round(g.done/g.total*100)}%"></i></div>
            <div class="gc-foot"><span class="gc-tag">${g.levelTag}</span><span class="gc-num">${g.done}/${g.total}</span></div>
          </button>`).join('')}
        <button class="goal-new" id="newGoal">＋ 我想学新东西…</button>
      </div>`;
    h.querySelectorAll('.goal-card').forEach(c=>{
      c.addEventListener('click', ()=> openGoal(c.dataset.goal));
    });
    h.querySelector('#newGoal').addEventListener('click', ()=> startCreation());
  });
}

function openGoal(id){
  const g = getGoal(id);
  if(!g) return;
  if(g.depth === 'shallow'){ toast('「' + g.title + '」在 demo 里还没实现，挑另外两个试试'); return; }
  state.goalId = id;
  renderGoalDetail(id);
  showScreen('goalDetail');
}

function renderGoalDetail(id){
  const g = getGoal(id);
  const hosts = document.querySelectorAll('[data-screen="goalDetail"]');
  hosts.forEach(h=>{
    h.innerHTML = `
      <header class="scr-head with-back">
        <button class="back" data-back="goal">‹</button>
        <h1>${g.title}</h1><p>${g.subject} · ${g.levelTag}</p>
      </header>
      <div class="trail">
        <div class="trail-title">成长轨迹</div>
        <div class="trail-bar">${g.abilities.map((_,i)=>
          `<span class="dot ${i < g.done ? 'done' : ''}"></span>`).join('')}</div>
        <div class="trail-note">${g.note}</div>
      </div>
      <ol class="ability-list">
        ${g.abilities.map((a,i)=>`
          <li class="ability ${i < g.done ? 'done' : ''}" data-i="${i}">
            <span class="ab-idx">${i < g.done ? '✓' : i+1}</span>
            <span class="ab-name">${a}</span>
            ${i === g.done ? '<span class="ab-play">开始这一关 ›</span>' : ''}
          </li>`).join('')}
      </ol>`;
    h.querySelectorAll('[data-back]').forEach(b=>{
      b.addEventListener('click', ()=> showScreen(b.dataset.back));
    });
    const next = h.querySelector('.ab-play');
    if(next) next.addEventListener('click', ()=> openGame(GOAL_GAME[g.id]));
  });
}

// ── 创作对话流
let chatIdx = 0;
function startCreation(){
  chatIdx = 0;
  state.goalId = null;
  const h = document.querySelector('[data-screen="goalDetail"]');
  h.innerHTML = `
    <header class="scr-head with-back">
      <button class="back" data-back="goal">‹</button>
      <h1>造一个新游戏</h1><p>说说你想学什么，不用管怎么实现</p>
    </header>
    <div class="chat"></div>
    <button class="chat-next" id="chatNext">继续 ›</button>`;
  h.querySelector('[data-back]').addEventListener('click', ()=> showScreen('goal'));
  h.querySelector('#chatNext').addEventListener('click', ()=> advanceCreation());
  showScreen('goalDetail');
  advanceCreation();
}

async function advanceCreation(){
  const host = document.querySelector('[data-screen="goalDetail"] .chat');
  const nextBtn = document.getElementById('chatNext');
  if(!host || !nextBtn) return;
  if(chatIdx >= CREATION_SCRIPT.length) return;      // 剧本已播完，等用户点预告卡
  const item = CREATION_SCRIPT[chatIdx++];
  if(item.kind === 'preview'){
    host.insertAdjacentHTML('beforeend', `
      <div class="preview-card">
        <div class="pv-emoji">${item.emoji}</div>
        <div class="pv-title">给你造一个 ${item.title} · 练${item.knowledge}</div>
        <div class="pv-meta">${item.mechanic}机制 · 一局约 90 秒</div>
        <button class="pv-start" data-game="${item.gameId}">开始玩 ›</button>
      </div>`);
    host.querySelector('.preview-card .pv-start')
        .addEventListener('click', e=> openGame(e.currentTarget.dataset.game));
    nextBtn.hidden = true;                            // 后面没有台词了，只等点"开始玩"
  } else {
    host.insertAdjacentHTML('beforeend', `<div class="msg ${item.from}"></div>`);
    const bubble = host.querySelector('.msg:last-child');
    if(SELFTEST_MODE){ bubble.textContent = item.text; }
    else { await typeInto(bubble, item.text); await wait(240); }
  }
  host.scrollTop = host.scrollHeight;
}

function typeInto(el, text){
  return new Promise(resolve=>{
    let i = 0;
    const t = setInterval(()=>{
      el.textContent = text.slice(0, ++i);
      if(i >= text.length){ clearInterval(t); resolve(); }
    }, 26);
  });
}

// 二创树的血缘链：从最早的祖先一路排到当前作品
function chainOf(game){
  const arr = [game];
  let cur = game;
  while(cur.parentId){
    const p = PUBLISHED.find(w=> w.id === cur.parentId);
    if(!p) break;
    arr.unshift(p); cur = p;
  }
  return arr;
}

function doRemix(gameId, tier, payload){
  const parent = PUBLISHED.find(w=> w.id === gameId);
  if(!parent) return;
  const mech = tier === 'mechanic' ? MECHANICS.find(m=> m.id === payload) : MECHANICS.find(m=> m.id === parent.mechanic);
  const title = tier === 'skin'  ? `${payload}版${parent.title}`
              : tier === 'material' ? `${parent.title}·${payload}版`
              : `${mech.name}版${parent.title}`;
  const id = 'w-remix-' + (PUBLISHED.filter(w=> w.id.startsWith('w-remix-')).length + 1);
  PUBLISHED.unshift({
    id, title, author:'我', subject: tier === 'material' ? payload : parent.subject,
    mechanic: mech.id, plays:0, emoji: parent.emoji,
    cover: tier === 'skin' ? ['#1E2E5A','#5A8AFF'] : parent.cover,
    parentId: parent.id, remixes:0, score:0, mine:true,
  });
  parent.remixes++;
  document.querySelector('.remix-sheet')?.remove();
  toast(tier === 'skin' ? '换好皮了，已放进广场' : '改好了，已放进广场');
}

// ── 我：把 GOALS / PUBLISHED / BUS 汇总成「进步只给自己看」的一页，不做人名排名
function myStats(){
  const by = {};
  BUS.attempts.forEach(a=>{ by[a.point] = by[a.point] || { ok:0, n:0 }; by[a.point].n++; if(a.ok) by[a.point].ok++; });
  const skills = Object.entries(by)
    .map(([point,v])=>({ point, rate: +(v.ok / v.n).toFixed(2) }))
    .sort((a,b)=> b.rate - a.rate);
  return {
    // 「玩过」= 本会话打完的局数。不要写成 + GOALS.reduce((s,g)=> s+g.done, 0)：
    // 那是「已通关的能力数」，两种单位相加会让赢一局同时推进两处、一局显示成两局
    played: BUS.runs.length,
    made: PUBLISHED.filter(w=> w.mine && !w.parentId).length,
    remixed: PUBLISHED.filter(w=> w.mine && w.parentId).length,
    best: Math.max(0, ...PUBLISHED.filter(w=> w.mine).map(w=> w.score)),
    skills,
  };
}

const GAMES_INDEX = {
  'guitar-l1':   { id:'guitar-l1',   title:'手指跑酷',   subject:'乐理', mechanic:'rhythm',  knowledge:'和弦转换', emoji:'🎸', skin:'stage',

  'fraction-l3': { id:'fraction-l3', title:'分数僵尸战', subject:'数学', mechanic:'collide', knowledge:'通分',     emoji:'🧟', skin:'graveyard',
                   cover:['#2E1E4A','#7C5CFF'] },
};

let activeMechanic = null;
let gameGen = 0;                             // 每次开/关局自增，让在飞的倒计时自我作废

function openGame(gameId){
  const g = GAMES_INDEX[gameId];
  if(!g){ toast('这一关 demo 还没做'); return; }
  state.gameId = gameId;
  const c = document.getElementById('container');
  c.querySelector('.cg-forecast').textContent = '给你造一个 ' + g.title + ' · 练' + g.knowledge;
  c.querySelector('.cg-stage').hidden = true;

  c.classList.add('on');
  gameGen++;                                // 每次开新局都作废在飞的倒计时
  if(SELFTEST_MODE) return;                 // 自检不跑倒计时，改用 mountNow
  countdownThenMount(gameId, gameGen);

// 藏等待：预告条已出、骨架屏在呼吸，3 秒倒计时数完再注入内容 —— 全程不出现进度条
async function countdownThenMount(gameId, gen){
  const cd = document.querySelector('#container .cd-count');
  cd.hidden = false;
  for(const n of [3, 2, 1]){
    if(gen !== gameGen) return;              // 期间关过容器，这轮倒计时作废
    cd.textContent = n;
    await wait(700);
  }
  if(gen !== gameGen) return;
  cd.hidden = true;
  mountNow(gameId);
}

function mountNow(gameId){
  const g = GAMES_INDEX[gameId];
  const c = document.getElementById('container');
  const stage = c.querySelector('.cg-stage');
  activeMechanic?.destroy?.();               // 先销毁上一局，否则旧 rAF 循环会成为孤儿并污染 BUS
  c.querySelector('.cg-skeleton').hidden = true;
  c.querySelector('.cd-count').hidden = true;
  stage.hidden = false;
  stage.className = 'cg-stage cg-live';
  stage.innerHTML = '';
  activeMechanic = runMechanic(g.mechanic, MECHANIC_CONTENT[gameId], stage);
}

function closeGame(){
  gameGen++;                                 // 让在飞的倒计时作废
  activeMechanic?.destroy?.();
  activeMechanic = null;
  document.getElementById('container').classList.remove('on');
  state.gameId = null;
}

function runMechanic(mechanicId, content, mount){
  if(mechanicId === 'rhythm')  return runRhythm(content, mount);
  if(mechanicId === 'collide') return runCollide(content, mount);
  mount.innerHTML = '<div class="cg-todo">这个机制在 demo 里还没做</div>';
  return { destroy(){} };
}

// 抢拍：4 条轨道，和弦方块自上落下，到判定线时点对应轨道
function runRhythm(content, mount){
  const JUDGE = 0.82;                 // 判定线位置（0=顶 1=底）
  const WINDOW = 0.18;                // 判定窗口半径
  const FALL = content.fall;          // 每毫秒下落比例，乘速度
  const GAP  = content.gap;           // 相邻方块的出发间距
  let hp = content.hp, combo = 0, maxCombo = 0, hits = 0, t0 = performance.now();
  let queue = content.blocks.map(b=>({ ...b, pos: -b.at * GAP, live:true }));
  let raf = null, last = 0, over = false;

  mount.innerHTML = `
    <div class="rhythm">
      <div class="hud">
        <span class="hp">${hp}</span>
        <span class="combo">0</span>
      </div>
      <div class="lanes">
        ${content.tracks.map((c,i)=>`
          <button class="track" data-track="${i}">
            <span class="tk-chord">${c.label}</span>
            <span class="tk-fing">${c.fingering}</span>
          </button>`).join('')}
        <div class="judge-line"></div>
        <div class="blocks"></div>
      </div>
    </div>`;

  const lanes = mount.querySelector('.blocks');
  const elHp = mount.querySelector('.hp');
  const elCombo = mount.querySelector('.combo');

  function paint(){
    lanes.innerHTML = queue.filter(b=>b.live)
      .map(b=>`<div class="block" data-track="${b.track}" data-live="1"
                    style="top:${(b.pos*100).toFixed(1)}%">${content.tracks[b.track].label}</div>`).join('');
  }

  function step(dt){
    if(over) return;
    const speed = content.speed * (1 + Math.min(0.6, (performance.now() - t0) / 150000));
    queue.forEach(b=>{
      if(!b.live) return;
      b.pos += FALL * dt * speed;
      if(b.pos >= JUDGE + 0.06){                  // 漏掉
        b.live = false; combo = 0;
        hp--; reportAttempt({ point:b.point, ok:false, ms: dt });
        flash('miss');
      }
    });
    elHp.textContent = hp;
    elCombo.textContent = combo;
    paint();
    if(hp <= 0) return end('lose');
    if(hits >= content.blocks.length) return end('win');
  }

  function hit(trackIdx){
    if(over) return;
    const cand = queue.filter(b=>b.live && b.track === trackIdx && Math.abs(b.pos - JUDGE) < WINDOW);
    const target = cand.sort((a,b)=> Math.abs(a.pos-JUDGE) - Math.abs(b.pos-JUDGE))[0];
    if(target){
      target.live = false; hits++; combo++; maxCombo = Math.max(maxCombo, combo);
      reportAttempt({ point: target.point, ok:true, ms: Math.round(performance.now() - t0) });
      flash('hit');
    } else {
      combo = 0; hp--;
      reportAttempt({ point: content.tracks[trackIdx].label + '和弦指法', ok:false, ms: 0 });
      flash('miss');
    }
    elHp.textContent = hp;
    elCombo.textContent = combo;
    paint();
    if(hp <= 0) return end('lose');
  }

  function flash(kind){
    const el = mount.querySelector('.rhythm');
    el.classList.remove('fx-hit','fx-miss');
    void el.offsetWidth;
    el.classList.add('fx-' + kind);
  }

  function end(outcome){
    over = true;
    cancelAnimationFrame(raf);
    finishRun({ outcome, ms: Math.round(performance.now() - t0), maxCombo, hits, total: content.blocks.length });
    showResult(outcome, { maxCombo, hits, total: content.blocks.length });
  }

  mount.querySelectorAll('.track').forEach(t=>{
    t.addEventListener('click', ()=> hit(Number(t.dataset.track)));
  });

  function loop(now){
    const dt = last ? now - last : 16;
    last = now;
    step(dt);
    if(!over) raf = requestAnimationFrame(loop);
  }
  if(!SELFTEST_MODE){ raf = requestAnimationFrame(loop); }
  paint();

  return {
    destroy(){ over = true; cancelAnimationFrame(raf); },
    _step(dt){ step(dt); },
  };
}

// 对撞：僵尸从右往左走，头顶一道分数算式，下方三门炮里挑正确答案。
// 答对的炮把最近僵尸打碎；答错僵尸前进一步（不揭示答案，也不掉墙壁血）。
// 僵尸走进射程（content.enter）之前炮台没架好，点击是空操作。
function runCollide(content, mount){
  let wave = 0, wallHp = content.wallHp, over = false, last = 0, raf = null;
  let zombies = [];

  mount.innerHTML = `
    <div class="collide">
      <div class="hud"><span class="wall">${wallHp}</span><span class="wave">第 1/8 波</span></div>
      <div class="field"><div class="wall-face"></div></div>
      <div class="turrets"></div>
    </div>`;

  const field = mount.querySelector('.field');
  const elWall = mount.querySelector('.wall');
  const elWave = mount.querySelector('.wave');
  const elTurrets = mount.querySelector('.turrets');

  function optionsFor(z){
    const opts = [z.answer, ...z.decoys];        // opts[0] 恒为正确答案
    const k = z.expr.replace(/\D/g, '').length % opts.length;
    const rot = opts.slice(k).concat(opts.slice(0, k));   // 确定性轮转打乱，便于自检
    return rot.map(label => ({ label, ok: label === z.answer }));
  }

  function spawnWave(){
    zombies = content.waves[wave].zombies.map(z=>({ ...z, pos:0, live:true, opts: optionsFor(z) }));
    elWave.textContent = `第 ${wave+1}/8 波`;
    paint();
  }

  function front(){ return zombies.filter(z=> z.live).sort((a,b)=> b.pos - a.pos)[0]; }

  function paint(){
    field.querySelectorAll('.zombie').forEach(e=> e.remove());
    zombies.filter(z=> z.live).forEach(z=>{
      field.insertAdjacentHTML('beforeend',
        `<div class="zombie" data-id="${z.id}" data-pos="${z.pos.toFixed(3)}"
              style="right:${(z.pos*72).toFixed(1)}%">
           <span class="zm-body">🧟</span><span class="zm-expr">${z.expr}</span>
         </div>`);
    });
    const f = front();
    elTurrets.innerHTML = f ? f.opts.map((o,i)=>
      `<button class="turret" data-ok="${o.ok ? 1 : 0}" data-i="${i}">${o.label}</button>`).join('') : '';
    // 纯视觉：僵尸还没进射程（或场上无僵尸）时炮台呈未架好态。_tap 的语义不受它影响。
    elTurrets.classList.toggle('disarmed', !f || f.pos < content.enter);
    elTurrets.querySelectorAll('.turret').forEach(t=>{
      t.addEventListener('click', ()=> tap(Number(t.dataset.i)));
    });
  }

  function step(dt){
    if(over || !zombies.length) return;
    const speed = content.speed * (1 + wave * 0.08);
    zombies.forEach(z=>{
      if(!z.live) return;
      z.pos += dt * 0.00004 * speed;
      if(z.pos >= 1 && !z.breached){
        z.breached = true; z.live = false;
        wallHp--; elWall.textContent = wallHp;
        reportAttempt({ point:'通分', ok:false, ms: dt });
        field.classList.add('fx-crack');
        if(wallHp <= 0) return end('lose');
      }
    });
    // 整波都被打穿（不是被点掉）时也要推进：否则场上无僵尸、wave 不增、墙没倒，
    // 局面永久冻结 —— 没得点也没得输。最后一波这样清掉就直接判负。
    if(!over && zombies.length && !zombies.some(z=> z.live)){
      wave++;
      if(wave >= content.waves.length) return end('lose');
      spawnWave();
    }
    paint();
  }

  function tap(i){
    if(over) return;
    const f = front();
    if(!f || f.pos < content.enter) return;   // 未进入射程：炮台还没架好，点击不生效
    const opt = f.opts[i];
    reportAttempt({ point:'通分', ok: opt.ok, ms: 0 });
    if(opt.ok){
      f.live = false;
      field.classList.add('fx-boom');
      if(!zombies.some(z=> z.live)){
        wave++;
        if(wave >= content.waves.length) return end('win');
        spawnWave();
      } else paint();
    } else {
      f.pos = Math.min(0.99, f.pos + 0.22);
      paint();
    }
    setTimeout(()=> field.classList.remove('fx-boom','fx-crack'), 220);
  }

  function end(outcome){
    if(over) return;          // 同一帧里可能有多只僵尸一起破墙，一局只结算一次
    over = true;
    cancelAnimationFrame(raf);
    finishRun({ outcome, ms: 0, wave, wallHp });
    showResult(outcome, { maxCombo: 0, hits: wave, total: content.waves.length });
  }

  function loop(now){
    const dt = last ? now - last : 16; last = now;
    step(dt);
    if(!over) raf = requestAnimationFrame(loop);
  }

  spawnWave();
  if(!SELFTEST_MODE) raf = requestAnimationFrame(loop);

  return { destroy(){ over = true; cancelAnimationFrame(raf); }, _step(dt){ step(dt); }, _tap(i){ tap(i); } };
}

// ── 结算 · 反哺：按知识点正确率算出「过了什么 / 卡在哪 / 下一关」 ──
// 每局结算是 per-run 的：只统计本局（run === gameGen）的尝试，喂给下一局的生成。
// 跨局累积是成长轨迹页的事，读未过滤的 BUS.attempts。
// 反哺的对象是知识点，不是分数：stats 只是 spec §7 约定的 finished 载荷形状，
// 这里刻意不渲染（连击/命中数一旦上行，就退回成积分式评判，违反 spec :92 对「选择题积分」的死刑判决）。
function summarize(){
  const by = {};
  BUS.attempts.filter(a=> a.run === gameGen).forEach(a=>{
    by[a.point] = by[a.point] || { ok:0, n:0 };
    by[a.point].n++; if(a.ok) by[a.point].ok++;
  });
  const rows = Object.entries(by).map(([point,v])=>({ point, rate: v.ok / v.n }))
    .sort((a,b)=> b.rate - a.rate);
  const strong = rows.filter(r=> r.rate >= 0.8);
  const weak = rows.filter(r=> r.rate < 0.8).sort((a,b)=> a.rate - b.rate);
  const strongTxt = strong.length ? strong.map(r=>r.point).join('、') : '还没有稳定的部分';
  const weakTxt = weak.length ? weak[0].point : '这局没有明显卡点';
  const next = weak.length
    ? `下一关把${weak[0].point}放慢一点，多给你几次机会`
    : '下一关提速，试试《完整来一遍》';
  return { strong: strongTxt, weak: weakTxt, next };
}

// ══ 6. SELFTESTS
const SELFTESTS = [];
let awaitedProbeMarks = 0;   // 异步用例在末尾自增，供"顺序屏障"用例观察
function test(name, fn){ SELFTESTS.push({ name, fn }); }
function assert(cond, msg){ if(!cond) throw new Error(msg || 'assert failed'); }
function assertText(sel, expected){
  const el = document.querySelector(sel);
  assert(el, '缺失元素 ' + sel);
  const got = el.textContent.trim();
  assert(got.includes(expected), sel + ' 期望包含「' + expected + '」，实际「' + got + '」');
}
function assertCount(sel, n){
  const got = document.querySelectorAll(sel).length;
  assert(got === n, sel + ' 期望 ' + n + ' 个，实际 ' + got + ' 个');
}
const SELFTEST_MODE = new URLSearchParams(location.search).get('selftest') === '1';
const wait = ms => SELFTEST_MODE ? Promise.resolve() : new Promise(r=>setTimeout(r, ms));

async function runList(list){
  const failed = [];
  for(const t of list){
    try { await t.fn(); } catch(e){ failed.push(t.name + ': ' + e.message); }
  }
  return failed;
}
async function runSelftests(){
  const failed = await runList(SELFTESTS);
  document.title = failed.length ? ('SELFTEST FAIL: ' + failed[0]) : 'SELFTEST OK';
}

test('跑酷一局时长落在 60–120 秒', ()=>{
  const c = MECHANIC_CONTENT['guitar-l1'];
  const END = 0.88;                                  // 判定线 + 漏接阈值

  let pos = 0, ms = 0;
  while(pos < travel && ms < 400000){
    pos += c.fall * 100 * (1 + Math.min(0.6, ms / 150000));   // 速度随时间线性升到 1.6
    ms += 100;
  }
  const sec = ms / 1000;
  assert(sec >= 60 && sec <= 120,
    '一局应落在 60–120 秒（生成律），按常量估算约 ' + sec.toFixed(0) + ' 秒');
});

test('对撞一局最短时长落在 60–120 秒', ()=>{
  // 这条会真打赢一局 → finishRun 钩子调用 advanceGoal('fraction-l3') 永久推进 fraction.done。
  // 不复原的话，整套自检跑完 GOALS 变成 [1,1,0,0]（干净加载应为 [1,0,0,0]）。
  const savedGoals = GOALS.map(g=>({ ...g }));
  const savedGameId = state.gameId;
  try{
    openGame('fraction-l3'); mountNow('fraction-l3');
    const m = activeMechanic, runsBefore = BUS.runs.length;
    let ms = 0;
    while(BUS.runs.length === runsBefore && ms < 400000){
      m._step(200); ms += 200;
      const turrets = [...document.querySelectorAll('#container .turret')];
      const ok = turrets.findIndex(t=> t.dataset.ok === '1');
      if(ok >= 0) m._tap(ok);
    }
    const sec = ms / 1000;
    assert(BUS.runs.length > runsBefore, '一局应能打完，实际 ' + sec.toFixed(0) + ' 秒仍未结束');
    assert(sec >= 60 && sec <= 120,
      '一局应落在 60–120 秒（生成律），完美通关也要 ' + sec.toFixed(0) + ' 秒');
  } finally {
    GOALS.forEach((g,i)=> Object.assign(g, savedGoals[i]));
    state.gameId = savedGameId;
  }
});

test('单局榜条目点一下直接进游戏容器（不经过作品页）', ()=>{
  // spec §9.3 :249：单局榜留在作品页内，但它的条目「点一下直接进游戏容器，不经过作品页，零摩擦」。
  // 排行榜页的行走作品页（那是另一回事），这里验的是作品页内的单局榜。
  const container = document.getElementById('container');
  const page = document.querySelector('[data-screen="gamePage"]');
  const savedCls = container.className;
  const saved = { screen: state.screen, gameId: state.gameId, pageId: state.pageId };
  try{
    openGamePage('w-unit-swap');                 // 先把作品页（含单局榜）渲染出来
    const work = PUBLISHED.find(w=> w.id === 'w-unit-swap');
    assert(work, '需要一件预置作品作样本');
    showScreen('square');                        // 离开作品页：DOM 还在，board-row 仍可点到
    assert(page.hidden, '前置：此时作品页应已隐藏');
    // 自带前置，不借外来的泄漏值：跑到这里时，前面的探针早已把容器留成 on、把 gameId 留成 guitar-l1。
    // 若沿用那些残留，断言 1（容器 on）恒真，断言 2 的红也只是"残留值恰好不等于目标值"——删掉监听也照样绿。
    container.classList.remove('on');
    state.gameId = null; state.pageId = null;    // 哨兵：与 playTarget(work) 明确不同，点击后变成目标值才真是点击造成的
    assert(!container.classList.contains('on'), '前置：容器应先归零，不依赖前面探针的残留');
    assert(state.gameId === null, '前置：state.gameId 应先归零');
    const row = document.querySelector('.gp-board .board-row');
    assert(row, '单局榜应有一行可点');
    row.click();
    assert(container.classList.contains('on'), '点单局榜应进入游戏容器');
    assert(state.gameId === playTarget(work),
      '应打开该作品对应的可玩局 ' + playTarget(work) + '，实际 ' + state.gameId);
    // 这条是存在理由：防「又走回作品页」——零摩擦要求不经过作品页（spec §9.3 :249）
    assert(page.hidden, '点单局榜不应又走回作品页');
    assert(state.screen !== 'gamePage', '不应把屏幕切回作品页，实际 ' + state.screen);
  } finally {
    document.querySelector('#container .result')?.remove();
    // 防御性复原，不承重：容器在本条之前就被前面的探针留成了 on（本条先摘掉 on，点击后又加回来），
    // 这里清不清仍是全绿。「探针跑完容器必须归零」这条不变式目前仓内没有断言，将来破了也不会有探针报警——静默回归。
    container.className = savedCls;
    state.screen = saved.screen; state.gameId = saved.gameId; state.pageId = saved.pageId;
    showScreen(saved.screen || 'goal');
  }
});

test('卡片上不出现头像或账号 ID', ()=>{
  // 红线用例必须在「作者是 persona」的卡上跑：guitar-l1 是当前用户自己发布的

  // 自播种，不依赖前一条用例留下的卡片，也就不用去读 null.innerHTML。
  const sample = PUBLISHED.find(w=> w.id === 'w-fraction-zombie');
  assert(sample && sample.author && sample.author !== '我', '需要一件作者是第三方昵称的作品作样本');
  document.querySelector('.share-card')?.remove();

  assert(!/avatar|user-?id|@/.test(txt), '不得出现头像或账号痕迹');
  // 红线不止 latin 词：卡片文本里也不能出现任何他人昵称（title / line 插值是最容易漏的口子）。
  // 排除「我」—— publishCurrent 给自己打的标记，单字且广场到处在用，算进来会误伤正常文案。
  const handles = [...new Set(PUBLISHED.map(w=> w.author))].filter(a=> a !== '我');
  assert(handles.includes(sample.author), '样本作者应落在第三方昵称集合里，否则本用例又空过');
  const leak = handles.find(h=> txt.includes(h));
  assert(!leak, '卡片文本不得出现他人昵称，实际出现「' + leak + '」');
  // 再核对这张卡确实按数据渲染出了该作品的标题与身份描述（不然上面的红线断言也可能空过）
  assertText('.sc-title', sample.title);
  assertText('.sc-anon', ANON_LABELS[sample.subject]);
});
test('分享卡与 toast 盖在游戏容器之上，真实路径下可见可命中', ()=>{
  // 其余用例都在断文本和 class —— 绘制顺序对它们完全不可见。这条补上命中测试：
  // 走真实入口（结算页的「发给朋友」），此时 #container 正开着，卡片必须盖在它上面。
  const container = document.getElementById('container');
  try{
    openGame('guitar-l1');
    showResult('win', { maxCombo:12, hits:24, total:24 });
    assert(container.classList.contains('on'),
      '结算时容器应是打开状态（正是「发给朋友」可用的状态）');
    const btn = document.querySelector('#container .result .rs-share');
    assert(btn, '结算页应有「发给朋友」');
    btn.click();
    const card = document.querySelector('.share-card');
    assert(card, '点「发给朋友」后应出现分享卡');
    const r = card.getBoundingClientRect();            // viewport 坐标，已含 #scaler 的缩放
    assert(r.width > 0 && r.height > 0,
      '卡片应有非零尺寸，否则命中测试没有意义（实际 ' + r.width + '×' + r.height + '）');
    const hit = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
    assert(hit === card || card.contains(hit),
      '卡片中心应命中卡片或其后代（z-index 必须高于 #container 的 20），实际命中 ' +
      (hit ? (hit.className || hit.tagName) : hit));
    // toast 也用同一条真实路径验一遍（发布 / 分享的确认都在容器里弹）。
    // #toast 是 pointer-events:none，elementFromPoint 只会返回它下面的元素、对 toast 无意义，
    // 所以这里改成比较计算后的 z-index 排序 —— 退回 5 一样会 RED。
    card.remove();
    toast('测试 toast');
    const toastEl = document.getElementById('toast');
    const tz = Number(getComputedStyle(toastEl).zIndex);
    const cz = Number(getComputedStyle(container).zIndex);
    assert(tz > cz,
      '#toast 的 z-index（' + tz + '）必须高于 #container（' + cz + '），否则结算页的确认提示会被整块盖住');
  } finally {
    // 断言中途抛错也要收干净，别把开着的容器 / 卡片漏给后面的用例
    document.querySelector('.share-card')?.remove();
    document.querySelector('#container .result')?.remove();
    closeGame();
  }
});

test('成长轨迹按正确率画条，且不排名', ()=>{
  const host = document.querySelector('[data-screen="me"]');
  const saved = host.innerHTML;
  const savedAttempts = BUS.attempts.slice();
  const savedScreen = state.screen;
  try{
    BUS.attempts.length = 0;
    // 通分 3/3 = 100%，约分 1/2 = 50%：两种正确率才验得出「条按比例画」
    ['通分','通分','通分','约分','约分'].forEach((p,i)=>
      reportAttempt({ point:p, ok: i < 3 || i === 3, ms:100 }));
    showScreen('me');                       // 必须可见：hidden 屏的 getBoundingClientRect 恒为 0
    // 先证明屏上真的渲染出了内容 —— 否则下面「不含排名」会在空屏上空过
    assertCount('.me-stats .ms-cell', 4);
    assertText('.me-skills h2', '成长轨迹');
    const s = document.querySelector('.skill[data-point="通分"]');
    assert(s, '应有「通分」技能条');
    assert(Number(s.dataset.rate) > 0.9, '通分正确率应 >0.9，实际 ' + s.dataset.rate);
    // 断言「渲染出来的填充」：没有 .me-skills 的 CSS 时行内 <i> 宽度恒为 0，
    // 「样式坏了」会伪装成「数据没绑上」，两者都静默
    const bar = p => document.querySelector('.skill[data-point="' + p + '"] .sk-bar > i');
    const w100 = bar('通分').getBoundingClientRect().width;
    const w50  = bar('约分').getBoundingClientRect().width;
    assert(w100 > 0, '通分填充应有非零宽度（无 CSS 时行内 <i> 为 0），实际 ' + w100);
    assert(w50 > 0, '约分填充应有非零宽度，实际 ' + w50);
    assert(Math.abs(w100 / w50 - 2) < 0.35,
      '100% 的条应约为 50% 的两倍，实际 ' + w100 + ' / ' + w50 + ' = ' + (w100 / w50));
    assert(!host.textContent.includes('排名'), '「我」页面不做人名排名');
  } finally {
    // showScreen 必须在复原 innerHTML 之前：savedScreen 恰为 me 时它会再跑一次 renderMe 把作品卡写回
    showScreen(savedScreen || 'goal');
    host.innerHTML = saved;
    BUS.attempts.length = 0; BUS.attempts.push(...savedAttempts);
  }
});
test('四格统计的数值口径正确，不是一个只数格子的空壳', ()=>{
  // 变异「made: …length + 1」必须变红 —— 只断个数=4 是抓不住口径错的
  const host = document.querySelector('[data-screen="me"]');
  const saved = host.innerHTML;
  const savedScreen = state.screen;
  const cells = ()=> [...document.querySelectorAll('.me-stats .ms-cell b')].map(b=> b.textContent);
  const savedGoals = GOALS.map(g=>({ ...g }));
  const savedRuns = BUS.runs.length, savedAttempts = BUS.attempts.length;
  const savedMine = PUBLISHED.map(w=> w.mine);   // 前面的用例发布过「我的」作品，先摘掉才验得出干净态的 0
  try{
    // 干净加载态：guitar 已通关 1 项（Task 2 烤进数据），它对「玩过」不该有任何贡献。
    // 刻意不清零 done —— 清零会把「口径算进了 Σdone」这个错正好遮住（brief 原文在此会空过）。
    GOALS.forEach(g=> g.done = 0); GOALS.find(g=> g.id === 'guitar').done = 1;
    BUS.runs.length = 0;
    PUBLISHED.forEach(w=> w.mine = false);
    showScreen('me');
    assert(JSON.stringify(cells()) === JSON.stringify(['0','0','0','0']),
      '干净状态四格应全为 0（已通关的 1 项不能算成「玩过」），实际 ' + cells().join(','));
    BUS.runs.push({ outcome:'win', ms:1 }); BUS.runs.push({ outcome:'lose', ms:1 });
    renderMe();
    assert(cells()[0] === '2', '「玩过」应等于对局数 2，实际 ' + cells()[0]);
  } finally {
    showScreen(savedScreen || 'goal');
    host.innerHTML = saved;
    GOALS.forEach((g,i)=> Object.assign(g, savedGoals[i]));
    BUS.runs.length = savedRuns; BUS.attempts.length = savedAttempts;
    PUBLISHED.forEach((w,i)=>{ if(savedMine[i]) w.mine = true; else delete w.mine; });
  }
});
test('通关会把进度累积回目标（一局打完，回目标详情就多点亮一格）', ()=>{
  // spec §四 ③「轨迹累积到目标下」：没有任何别的地方写 GOALS.done，
  // 只靠 Task 2 烤进数据的 done:1，这一条永远是死数
  const host = document.querySelector('[data-screen="me"]');
  const savedMe = host.innerHTML;
  const savedScreen = state.screen;
  const savedGoals = GOALS.map(g=>({ ...g }));
  const savedGameId = state.gameId;
  const savedRuns = BUS.runs.length, savedAttempts = BUS.attempts.length;
  try{
    const g = GOALS.find(x=> x.id === 'guitar');
    g.done = 1;
    // 赢一局 → 目标前进一格
    state.gameId = GOAL_GAME.guitar;
    finishRun({ outcome:'win', ms:1 });
    assert(g.done === 2, '赢了应推进到 2，实际 ' + g.done);
    // 输一局不推进：「没撑住」不能解锁下一项能力
    finishRun({ outcome:'lose', ms:1 });
    assert(g.done === 2, '输了不应推进，实际 ' + g.done);
    // 不属于任何目标的作品（自造 / 二创）不推进
    g.done = 1;
    state.gameId = 'w-remix-1';
    finishRun({ outcome:'win', ms:1 });
    assert(g.done === 1, '自造作品不应推进目标，实际 ' + g.done);
    // 到顶不越界
    g.done = g.total;
    state.gameId = GOAL_GAME.guitar;
    finishRun({ outcome:'win', ms:1 });
    assert(g.done === g.total, '不应超过 total，实际 ' + g.done);
  } finally {
    showScreen(savedScreen || 'goal');
    host.innerHTML = savedMe;
    GOALS.forEach((g,i)=> Object.assign(g, savedGoals[i]));
    state.gameId = savedGameId;
    BUS.runs.length = savedRuns; BUS.attempts.length = savedAttempts;
  }
});
